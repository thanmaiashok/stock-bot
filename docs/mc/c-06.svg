serve" font-family="VT,monospace">|   |-- scheduler.py  </text><text x="226.40" y="288" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># APScheduler job definitions</text><text x="24.00" y="314" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- database.py   </text><text x="226.40" y="314" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># SQLite init</text><text x="24.00" y="340" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   `-- config.py     </text><text x="226.40" y="340" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Env-var config</text><text x="24.00" y="366" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- frontend/</text><text x="24.00" y="392" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   `-- src/          </text><text x="226.40" y="392" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># React + Vite + Tailwind</text><text x="24.00" y="418" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- docker-compose.yml</text><text x="24.00" y="444" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- start.sh          </text><text x="226.40" y="444" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># One-command launcher</text><text x="24.00" y="470" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- kill.sh           </text><text x="226.40" y="470" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Stop all services</text><text x="24.00" y="496" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">`-- .env.example      </text><text x="226.40" y="496" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Config te